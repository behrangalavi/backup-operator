name: CI

on:
  pull_request:
    branches: [main]
  # Lets release.yaml reuse this exact gate via workflow_call, so the PR
  # check and the main-push check cannot drift apart.
  workflow_call:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  # renovate: depName=golang/vuln
  GOVULNCHECK_VERSION: v1.1.4
  # renovate: depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.7.0
  # renovate: depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: 0.6.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        run: go build ./...

      # Race detector on: the operator is fan-out goroutines, pools and
      # semaphores end to end, and a data race here is a silent metrics or
      # status corruption in production.
      - name: Test
        working-directory: src
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: src
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: src/coverage.out
          retention-days: 14

      - name: Vet
        working-directory: src
        run: go vet ./...

  # Generated code (DeepCopy, CRD manifests) must match the API types in
  # src/api/v1alpha1. Uses the same pinned controller-gen run as `just
  # generate`, in its own module context so src/go.mod is left alone.
  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Regenerate
        working-directory: src
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.22.0 object paths=./api/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.22.0 crd paths=./api/... output:crd:dir=../charts/backup-operator/files/crds

      - name: Verify no drift
        run: git diff --exit-code -- src/api charts/backup-operator/files/crds

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # Pinned to a fixed golangci-lint release (not HEAD) so lint results
      # are reproducible across identical commits. The release binary must be
      # built with a Go >= the module's `go` directive (currently 1.26.2);
      # v2.12.2's binary is built with go1.26.2. Bump this in lockstep with
      # the Justfile target.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: src

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run govulncheck
        working-directory: src
        run: govulncheck ./...

  # Frontend unit tests (node:test, zero dependencies). Guarded so the job
  # is a no-op until src/ui/static/js/tests exists.
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: for f in src/ui/static/js/*.js; do node --check "$f"; done

      - name: Unit tests
        run: |
          if [ -d src/ui/static/js/tests ]; then
            node --test 'src/ui/static/js/tests/*.test.mjs'
          else
            echo "no frontend tests yet (src/ui/static/js/tests)"
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      # --strict fails the lint on warnings, not just errors.
      - name: Lint chart
        run: helm lint --strict charts/backup-operator --set agePublicKeys="age1test"

      # Behavioural assertions on the rendered templates (RBAC gating, CRD
      # keep policy, NetworkPolicy variants, worker env JSON contract,
      # recipient bootstrap). `helm lint` only proves it renders.
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: Chart unit tests
        run: helm unittest charts/backup-operator

      # Render the manifests so templating errors (bad indentation, missing
      # required values, invalid refs) fail the PR — helm lint alone does not
      # catch every render-time break. --api-versions monitoring.coreos.com/v1
      # forces the ServiceMonitor and PrometheusRule (gated on that CRD) to
      # actually render, so a template error in them fails CI instead of only
      # surfacing in-cluster.
      - name: Template chart (defaults)
        run: >-
          helm template backup-operator charts/backup-operator
          --api-versions monitoring.coreos.com/v1
          --set agePublicKeys="age1test" > rendered-default.yaml

      # Render with the optional subsystems ON and replicaCount>1 so their
      # templates (docs, pprof, scrub, verifier RBAC, NetworkPolicy incl.
      # worker policy and scoped egress, PDB, worker knobs) are exercised too.
      - name: Template chart (all features enabled)
        run: >-
          helm template backup-operator charts/backup-operator
          --api-versions monitoring.coreos.com/v1
          --set agePublicKeys="age1test"
          --set ui.enabled=true --set docs.enabled=true --set pprof.enabled=true
          --set storageScrub.enabled=true --set networkPolicy.enabled=true
          --set networkPolicy.monitoringNamespace=monitoring
          --set 'networkPolicy.apiServerCIDRs[0]=10.96.0.1/32'
          --set restoreVerification.enableEphemeralPodSpawn=true
          --set 'worker.nodeSelector.disk=fast'
          --set replicaCount=2 > rendered-all.yaml

      # Schema-validate the rendered manifests against the Kubernetes
      # OpenAPI schemas. Monitoring CRs have no upstream schema → skipped.
      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform

      - name: kubeconform
        run: kubeconform -strict -ignore-missing-schemas -schema-location default -summary rendered-default.yaml rendered-all.yaml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Smoke build for the runner's native arch only (no push). Catches
      # Dockerfile breakage (bad apt package, broken build stage) on every PR
      # without the cost of the full multi-arch release build. GHA layer cache
      # keeps repeat runs fast. load: true so the tool smoke-test below can run
      # the built image.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: backup-operator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The worker shells out to these; a missing or broken client binary is
      # a backup that silently never happens. Run each with --version so a
      # bad apt package or a glibc mismatch fails the PR, not the first cron.
      - name: Smoke-test DB client tools
        run: |
          set -eux
          docker run --rm --entrypoint sh backup-operator:ci -c 'pg_dump --version && mysqldump --version && mongodump --version && redis-cli --version'
          docker run --rm --entrypoint /app/backup-worker backup-operator:ci --help 2>&1 | grep -q -- '-source' || true
          docker run --rm --entrypoint /app/backup-operator backup-operator:ci --help 2>&1 | head -1 || true
