name: Release

on:
  push:
    branches: [main]

# Serialize releases. Two pushes back-to-back must not race on tag push,
# chart upload, or :latest re-tag. cancel-in-progress=false so the second
# push waits for the first to finish (success or failure) before starting.
concurrency:
  group: release
  cancel-in-progress: false

# Default to read-only at workflow scope; jobs that need write opt in
# explicitly. Reduces blast radius if any single step is compromised.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Quality gate. Reuses ci.yaml verbatim (workflow_call) so a main-push
  #    that bypasses a PR (direct push, force-push) runs exactly the checks
  #    the PR would have: build/race tests, lint, govulncheck, generated-file
  #    drift, chart unit tests + kubeconform, image smoke test, UI tests.
  test:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  # 2. Dry-run semantic-release to determine whether this push releases
  #    anything and, if so, the next version. Read-only token; no tag,
  #    no GitHub release created here.
  plan:
    runs-on: ubuntu-latest
    needs: test
    # semantic-release runs verifyConditions even in dry-run, which checks
    # that the GITHUB_TOKEN has the scopes needed for the real publish
    # (contents/issues/pull-requests write). Without these the dry-run
    # fails before producing outputs. Dry-run itself never writes.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.dryrun.outputs.new_release_published }}
      version: ${{ steps.dryrun.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: dryrun
        uses: cycjimmy/semantic-release-action@v5
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Build & push multi-arch image with the planned version. No :latest
  #    tag yet — that floats only after the entire release succeeds. The
  #    pushed image is scanned (Trivy, HIGH/CRITICAL fail the release) and
  #    signed keyless with cosign (Sigstore OIDC via id-token).
  build-image:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.plan.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.plan.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Scan the pushed multi-arch image. The runtime stage is ~530 MB of
      # Debian plus DB client packages — exactly the surface CVE scanners
      # exist for. .trivyignore carries dated, justified exceptions.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - uses: sigstore/cosign-installer@v3

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in Rekor. Verify with
      #   cosign verify --certificate-identity-regexp 'github.com/<owner>/<repo>/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>
      - name: Sign image
        env:
          COSIGN_YES: "true"
        run: cosign sign --recursive ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # 4. Package & push the Helm chart with the planned version. Runs only
  #    after image push succeeded — chart references the image, so we
  #    never publish a chart that points at a missing image.
  publish-chart:
    runs-on: ubuntu-latest
    needs: [plan, build-image]
    if: needs.plan.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5

      - name: Stamp chart version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.plan.outputs.version }}/" charts/backup-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.plan.outputs.version }}\"/" charts/backup-operator/Chart.yaml

      - name: Package chart
        run: helm package charts/backup-operator

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push chart
        id: push
        run: |
          helm push backup-operator-${{ needs.plan.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      # Sign the OCI chart artifact by digest, same keyless flow as the image.
      - name: Sign chart
        env:
          COSIGN_YES: "true"
        run: cosign sign ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/backup-operator@${{ steps.push.outputs.digest }}

  # 5. Image + chart are now both pushed. Create the Git tag and the
  #    GitHub Release. If everything above failed, no tag exists and the
  #    release notes never publish — so a partial release never appears
  #    in the GitHub Releases page.
  tag-and-release:
    runs-on: ubuntu-latest
    needs: [plan, build-image, publish-chart]
    if: needs.plan.outputs.published == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 6. Float :latest only after a fully successful release. Uses
  #    imagetools to retag the multi-arch manifest without rebuilding.
  retag-latest:
    runs-on: ubuntu-latest
    needs: [plan, tag-and-release]
    if: needs.plan.outputs.published == 'true'
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Float :latest to ${{ needs.plan.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.plan.outputs.version }}