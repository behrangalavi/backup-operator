{{- /*
  CustomResourceDefinitions for backup.mogenius.io. Generated by
  controller-gen from src/api/v1alpha1 into files/crds (just generate) and
  templated here instead of using Helm's crds/ directory so that
  `helm upgrade` actually updates the schema when the API grows.

  The trade-off: Helm applies templated CRDs and CRs in one batch without
  waiting for the CRD to be established, so this chart deliberately ships
  NO custom resources — age recipients are seeded by the operator at
  startup from BOOTSTRAP_AGE_RECIPIENTS (see deployment.yaml).

  helm.sh/resource-policy: keep (crds.keep, default true) stops
  `helm uninstall` from deleting the CRDs — and with them every
  BackupSource / BackupDestination / BackupRecipient in the cluster.
*/}}
{{- /* `false | default true` is true in Go templates, so booleans that
       default to true are read with hasKey instead of `default`. */}}
{{- $crds := .Values.crds | default dict }}
{{- $install := true }}{{- if hasKey $crds "install" }}{{ $install = $crds.install }}{{ end }}
{{- $keep := true }}{{- if hasKey $crds "keep" }}{{ $keep = $crds.keep }}{{ end }}
{{- if $install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := $crd.metadata.annotations | default dict }}
{{- if $keep }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
{{- $labels := $crd.metadata.labels | default dict }}
{{- $_ := set $labels "app.kubernetes.io/name" (include "backup-operator.name" $) }}
{{- $_ := set $labels "app.kubernetes.io/part-of" "backup-operator" }}
{{- $_ := set $crd.metadata "labels" $labels }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
