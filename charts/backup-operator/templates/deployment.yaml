apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backup-operator.fullname" . }}
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "backup-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backup-operator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "backup-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backup-operator
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: WATCH_NAMESPACE
              value: {{ .Values.watchNamespace | default .Release.Namespace | quote }}
            - name: LEADER_ELECTION_ID
              value: {{ .Values.config.leaderElectionId | quote }}
            - name: DEFAULT_SCHEDULE
              value: {{ .Values.config.defaultSchedule | quote }}
            - name: RUN_TIMEOUT_SECONDS
              value: {{ .Values.config.runTimeoutSeconds | quote }}
            - name: TEMP_DIR
              value: {{ .Values.config.tempDir | quote }}
            - name: TEMP_DIR_SIZE
              value: {{ .Values.tempDirSize | quote }}
            - name: DEFAULT_RETENTION_DAYS
              value: {{ .Values.config.defaultRetentionDays | quote }}
            - name: DEFAULT_MIN_KEEP
              value: {{ .Values.config.defaultMinKeep | quote }}
            {{- with .Values.config.metricsRefreshIntervalSeconds }}
            - name: METRICS_REFRESH_INTERVAL_SECONDS
              value: {{ . | quote }}
            {{- end }}
            {{- if (.Values.storageScrub).enabled }}
            - name: STORAGE_SCRUB_ENABLED
              value: "true"
            - name: STORAGE_SCRUB_INTERVAL_HOURS
              value: {{ .Values.storageScrub.intervalHours | default 24 | quote }}
            {{- end }}
            # Worker pod template — reconciler bakes these into every CronJob it produces.
            - name: WORKER_IMAGE
              value: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
            - name: WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            {{- /* Mirror the operator's imagePullSecrets to worker pods so a
                   private-registry install can pull the image on every node,
                   not just where it happens to be cached. Comma-separated names. */}}
            {{- with .Values.imagePullSecrets }}
            - name: WORKER_IMAGE_PULL_SECRETS
              value: {{ range $i, $s := . }}{{ if $i }},{{ end }}{{ $s.name }}{{ end }}
            {{- end }}
            - name: WORKER_SERVICE_ACCOUNT
              value: {{ include "backup-operator.fullname" . }}-worker
            - name: AGE_SECRET_NAME
              value: {{ include "backup-operator.fullname" . }}-age
            {{- /* Age recipients from values, seeded as BackupRecipient objects
                   by the operator at startup. Shipped as an env var rather than
                   as CR manifests because Helm applies templated CRDs and CRs
                   in one batch; a CR whose CRD is not yet established fails
                   the first install. Accepts the array form (recommended) or
                   a string (single key or newline-separated). */}}
            {{- $keys := list }}
            {{- if kindIs "slice" .Values.agePublicKeys }}
              {{- range .Values.agePublicKeys }}{{- $line := trim . }}{{- if $line }}{{- $keys = append $keys $line }}{{- end }}{{- end }}
            {{- else if .Values.agePublicKeys }}
              {{- range (regexSplit "\n" .Values.agePublicKeys -1) }}{{- $line := trim . }}{{- if $line }}{{- $keys = append $keys $line }}{{- end }}{{- end }}
            {{- end }}
            {{- if not $keys }}
            {{- fail "agePublicKeys is required: set at least one age recipient public key (age1...)" }}
            {{- end }}
            - name: BOOTSTRAP_AGE_RECIPIENTS
              value: {{ join "," $keys | quote }}
            {{- with .Values.workerResources }}
            {{- if .limits }}
            {{- if .limits.cpu }}
            - name: WORKER_CPU_LIMIT
              value: {{ .limits.cpu | quote }}
            {{- end }}
            {{- if .limits.memory }}
            - name: WORKER_MEMORY_LIMIT
              value: {{ .limits.memory | quote }}
            {{- end }}
            {{- end }}
            {{- if .requests }}
            {{- if .requests.cpu }}
            - name: WORKER_CPU_REQUEST
              value: {{ .requests.cpu | quote }}
            {{- end }}
            {{- if .requests.memory }}
            - name: WORKER_MEMORY_REQUEST
              value: {{ .requests.memory | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: WORKER_BACKOFF_LIMIT
              value: {{ .Values.workerBackoffLimit | default 2 | quote }}
            {{- /* Worker pod scheduling / extension knobs. Rendered as JSON
                   so the operator can unmarshal them into the K8s types
                   (map[string]string, []Toleration, *Affinity, []EnvVar,
                   []Volume, []VolumeMount) when templating each CronJob.
                   Each env is omitted when its value is empty. */}}
            {{- with .Values.worker }}
            {{- with .nodeSelector }}
            - name: WORKER_NODE_SELECTOR
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .tolerations }}
            - name: WORKER_TOLERATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .affinity }}
            - name: WORKER_AFFINITY
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .priorityClassName }}
            - name: WORKER_PRIORITY_CLASS_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .podAnnotations }}
            - name: WORKER_POD_ANNOTATIONS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .extraEnv }}
            - name: WORKER_EXTRA_ENV
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .extraVolumes }}
            - name: WORKER_EXTRA_VOLUMES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .extraVolumeMounts }}
            - name: WORKER_EXTRA_VOLUME_MOUNTS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.ui.enabled }}
            - name: UI_ENABLED
              value: "true"
            - name: UI_ADDR
              value: ":{{ .Values.ui.port }}"
            - name: UI_READ_ONLY
              value: {{ .Values.ui.readOnly | default false | quote }}
            - name: UI_ALLOW_KEY_MUTATION
              value: {{ .Values.ui.allowKeyMutation | default false | quote }}
            {{- with .Values.ui.maxBodyBytes }}
            - name: UI_MAX_BODY_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.maxSSEClients }}
            - name: UI_MAX_SSE_CLIENTS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- /* Alerts integration: with prometheusURL set, /api/alerts
                   mirrors what Alertmanager will route. Without it the UI
                   falls back to a local heuristic over our own metrics.
                   Both blocks are optional — Alertmanager isn't required
                   for this chart. The (deref) form short-circuits to nil
                   when `alerts:` is absent (e.g. helm upgrade --reuse-values
                   from a pre-alerts release). */}}
            {{- with (.Values.alerts).prometheusURL }}
            - name: PROMETHEUS_URL
              value: {{ . | trim | quote }}
            {{- end }}
            {{- with (.Values.alerts).alertmanagerURL }}
            - name: ALERTMANAGER_URL
              value: {{ . | trim | quote }}
            {{- end }}
            {{- /* (deref) form short-circuits to nil when `docs:` is
                   absent, e.g. helm upgrade --reuse-values from a
                   pre-docs release. Same pattern as the alerts block
                   above. */}}
            {{- if (.Values.docs).enabled }}
            - name: DOCS_ENABLED
              value: "true"
            - name: DOCS_ADDR
              value: ":{{ .Values.docs.port | default 8083 }}"
            - name: DOCS_DIR
              value: {{ .Values.docs.dir | default "/app/docs" | quote }}
            {{- end }}
            {{- /* pprof: opt-in debug listener, gated exactly like docs. The
                   (deref) form short-circuits to nil when `pprof:` is absent
                   (helm upgrade --reuse-values from a pre-pprof release).
                   Bound to loopback ONLY — a containerPort does not gate
                   reachability (any pod can dial <podIP>:port), so a
                   0.0.0.0 bind would expose heap dumps holding in-flight
                   Secret data cluster-wide. `kubectl port-forward` still
                   works against a loopback listener. */}}
            {{- if (.Values.pprof).enabled }}
            - name: PPROF_ADDR
              value: "127.0.0.1:{{ .Values.pprof.port | default 6060 }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8082
              protocol: TCP
            {{- if .Values.ui.enabled }}
            - name: ui
              containerPort: {{ .Values.ui.port }}
              protocol: TCP
            {{- end }}
            {{- if (.Values.docs).enabled }}
            - name: docs
              containerPort: {{ .Values.docs.port | default 8083 }}
              protocol: TCP
            {{- end }}
            {{- /* Declared for discoverability only. Safety comes from the
                   loopback bind on PPROF_ADDR above (a containerPort does not
                   restrict who can dial the pod), plus the absence of a
                   Service. Reachable via `kubectl port-forward`. */}}
            {{- if (.Values.pprof).enabled }}
            - name: pprof
              containerPort: {{ .Values.pprof.port | default 6060 }}
              protocol: TCP
            {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
