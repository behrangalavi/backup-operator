{{- if .Values.rbac.create -}}
# Operator Role — reconciles backup.mogenius.io objects into CronJobs,
# writes their status, observes Jobs, holds the leader-election lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup-operator.fullname" . }}
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  # Discovery contract: watch BackupSources / BackupDestinations /
  # BackupRecipients and write their status subresources. create/update/
  # delete only when the UI can mutate (CRUD pages); a read-only or UI-less
  # install gets a read-only operator.
  - apiGroups: ["backup.mogenius.io"]
    resources: ["backupsources", "backupdestinations", "backuprecipients"]
    verbs: ["get", "list", "watch"{{- if and .Values.ui.enabled (not .Values.ui.readOnly) }}, "create", "update", "patch", "delete"{{- end }}]
  - apiGroups: ["backup.mogenius.io"]
    resources: ["backupsources/status", "backupdestinations/status"]
    verbs: ["get", "update", "patch"]

  # Secrets: the operator reads destination credentials by name (metrics
  # refresher, scrubber, UI probes) and writes the merged age Secret the
  # worker pods mount. No list/watch — Secrets are read uncached, so the
  # operator never holds every Secret in the namespace. create/update/
  # delete on credentials Secrets only when the UI can mutate.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"{{- if and .Values.ui.enabled (not .Values.ui.readOnly) }}, "delete"{{- end }}]

  # Operator — manages CronJobs as the per-source materialised schedule.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Operator — observes Jobs spawned by CronJobs and creates manual-trigger Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]

  # Operator — leader election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Operator — emit events (worker, UI) and read them back for the
  # in-product audit view. get/list use the API reader directly to
  # avoid forcing a watch on a noisy resource.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup-operator.fullname" . }}
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.ui.enabled }}
---
# Operator ClusterRole — cluster-scoped permissions only. The UI's
# /api/cluster/capabilities endpoint runs a SubjectAccessReview against the
# worker SA to answer "would Phase-2 restore-verification actually work?".
# SubjectAccessReview is a virtual cluster-scoped resource (Create returns
# the answer; nothing persists), so it cannot live in a namespaced Role.
# Only rendered with the UI, which is the only consumer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backup-operator.fullname" . }}-cluster
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backup-operator.fullname" . }}-cluster
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backup-operator.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Worker Role — minimal privileges: read its BackupSource, list
# BackupDestinations, read the referenced credentials Secrets by name,
# emit audit events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup-operator.fullname" . }}-worker
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["backup.mogenius.io"]
    resources: ["backupsources"]
    verbs: ["get"]
  - apiGroups: ["backup.mogenius.io"]
    resources: ["backupdestinations"]
    verbs: ["get", "list"]

  # Credentials Secrets (source password, destination credentials, TLS CA)
  # are fetched by name only — no list, so a compromised worker cannot
  # enumerate the namespace's Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Worker — audit-trail events attached to BackupSources.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  {{- /* (deref) form short-circuits to nil when `restoreVerification:`
         is absent, e.g. helm upgrade --reuse-values from a release that
         predates Phase 2. Same pattern as the docs/alerts blocks. */}}
  {{- if (.Values.restoreVerification).enableEphemeralPodSpawn }}
  # Phase-2 restore verifier (schema-only / sample / full): worker
  # spawns a short-lived DB Pod in this namespace, owns it via
  # OwnerReference (cascade-delete on worker exit), and tears it down.
  # Disabled by default — enable when you set
  # spec.restoreVerification.mode to a Phase-2 mode.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup-operator.fullname" . }}-worker
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup-operator.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
