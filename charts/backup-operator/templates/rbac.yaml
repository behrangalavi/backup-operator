{{- if .Values.rbac.create -}}
# Operator Role — manages CronJobs, watches Secrets/Jobs, leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup-operator.fullname" . }}
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  # Operator reconciles source/destination Secrets into CronJobs.
  # create/update/delete needed for UI-driven CRUD of source/destination Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Operator — manages CronJobs as the per-source materialised schedule.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Operator — observes Jobs spawned by CronJobs and creates manual-trigger Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]

  # Operator — leader election lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Operator — reads/writes the settings ConfigMap for the UI wizard.
  # list/watch are required by controller-runtime's cached client to keep
  # its informer in sync; without them every Get blocks until timeout.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Operator — emit events (worker, UI) and read them back for the
  # in-product audit view. get/list use the API reader directly to
  # avoid forcing a watch on a noisy resource.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup-operator.fullname" . }}
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Operator ClusterRole — cluster-scoped permissions only. Currently the
# UI's /api/cluster/capabilities endpoint runs a SubjectAccessReview
# against the worker SA to answer "would Phase-2 restore-verification
# actually work?". SubjectAccessReview is a virtual cluster-scoped
# resource (Create returns the answer; nothing persists), so it cannot
# live in a namespaced Role. This binding is pure read intent — the
# operator never escalates a real privilege through it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backup-operator.fullname" . }}-cluster
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backup-operator.fullname" . }}-cluster
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backup-operator.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Worker Role — minimal privileges: read Secrets, emit audit events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup-operator.fullname" . }}-worker
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
rules:
  # Worker reads the source Secret it was pointed at and lists destinations.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # Worker — audit-trail events attached to source Secrets.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  {{- /* (deref) form short-circuits to nil when `restoreVerification:`
         is absent, e.g. helm upgrade --reuse-values from a release that
         predates Phase 2. Same pattern as the docs/alerts blocks. */}}
  {{- if (.Values.restoreVerification).enableEphemeralPodSpawn }}
  # Phase-2 restore verifier (schema-only / sample / full): worker
  # spawns a short-lived DB Pod in this namespace, owns it via
  # OwnerReference (cascade-delete on worker exit), and tears it down.
  # Disabled by default — enable when you set
  # restore-verification-mode to a Phase-2 mode.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup-operator.fullname" . }}-worker
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup-operator.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "backup-operator.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}
