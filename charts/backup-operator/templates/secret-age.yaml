{{/*
  Bootstrap age recipients as one Secret per public key, labeled
  role=age-recipient. The operator's RecipientReconciler discovers them
  and materialises a single merged Secret (named by AGE_SECRET_NAME)
  that worker pods mount via secretKeyRef.

  Two input forms (same as before):
    Array (recommended for rotation):
      agePublicKeys:
        - age1qx...
        - age1yz...
    String (single key, or newline-separated multiline for legacy):
      agePublicKeys: "age1qx..."

  Helm-bootstrapped Secrets are named <release>-recipient-N (sequential
  index). Lifecycle is helm-owned: removing an entry from values and
  upgrading deletes the corresponding bootstrap Secret. The operator
  also accepts ad-hoc recipient Secrets created outside Helm (e.g. via
  the UI Age-Keys page or a GitOps recipients/ directory) — anything
  with the role=age-recipient label flows into the merged target.
*/}}
{{- $keys := list -}}
{{- if kindIs "slice" .Values.agePublicKeys -}}
  {{- range .Values.agePublicKeys -}}
    {{- $line := trim . -}}
    {{- if $line -}}
      {{- $keys = append $keys $line -}}
    {{- end -}}
  {{- end -}}
{{- else if .Values.agePublicKeys -}}
  {{- range (regexSplit "\n" .Values.agePublicKeys -1) -}}
    {{- $line := trim . -}}
    {{- if $line -}}
      {{- $keys = append $keys $line -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- if not $keys -}}
{{- fail "agePublicKeys is required: set at least one age recipient public key (age1...)" -}}
{{- end -}}
{{- $fullname := include "backup-operator.fullname" . -}}
{{- $labels := include "backup-operator.labels" . -}}
{{- range $i, $k := $keys }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-recipient-{{ $i }}
  labels:
    {{- $labels | nindent 4 }}
    {{ "backup.mogenius.io/role" }}: age-recipient
    app.kubernetes.io/component: age-recipient-bootstrap
  annotations:
    backup.mogenius.io/name: bootstrap-{{ $i }}
type: Opaque
stringData:
  public-key: {{ $k | quote }}
{{- end }}
