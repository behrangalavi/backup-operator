{{/*
  agePublicKeys accepts either form for ergonomics:
    - String:   "age1qx..."           (or newline-separated multiline)
    - Array:    [age1qx..., age1yz...]

  Array is preferred for multi-key rotation: it avoids YAML multi-line
  indentation foot-guns and works cleanly via `--set agePublicKeys[0]=...`.
  The worker always sees the same newline-separated env-var format
  regardless of which form the operator wrote.
*/}}
{{- $keys := .Values.agePublicKeys -}}
{{- if kindIs "slice" $keys -}}
  {{- $keys = join "\n" $keys -}}
{{- end -}}
{{- $keys = trimAll "\n " (default "" $keys) -}}
{{- if not $keys -}}
{{- fail "agePublicKeys is required: set at least one age recipient public key (age1...)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backup-operator.fullname" . }}-age
  labels: {{- include "backup-operator.labels" . | nindent 4 }}
stringData:
  AGE_PUBLIC_KEYS: |-
    {{- $keys | nindent 4 }}
