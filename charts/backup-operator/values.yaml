image:
  # Must match the GitHub-Actions push target. The release workflow uses
  # `github.repository` for the image name, so `<owner>/<repo>` here has
  # to track wherever the source lives. Override at install time if you
  # mirror to another registry.
  repository: ghcr.io/behrangalavi/backup-operator
  tag: ""           # defaults to chart appVersion
  digest: ""        # set to pin by digest, e.g. "sha256:abc123..." (overrides tag)
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# Discovery is namespace-scoped — the service watches its own namespace only.
# Set to a different namespace to override; "" means the release namespace.
watchNamespace: ""

config:
  defaultSchedule: "0 2 * * *"
  runTimeoutSeconds: 3600
  tempDir: /tmp/backup-operator
  leaderElectionId: "backup-operator"
  # Retention defaults — sources can override per-secret via annotations
  # backup.mogenius.io/retention-days and /min-keep.
  # 0 retentionDays disables pruning (keep forever); minKeep is the safety
  # floor that prevents accidentally deleting the most recent backups.
  defaultRetentionDays: 30
  defaultMinKeep: 3

# Public age recipient(s). Required: the chart fails to render if empty.
#
# Two forms accepted:
#
#   1) Array (recommended for multi-key rotation):
#        agePublicKeys:
#          - age1qx...
#          - age1yz...
#      Avoids YAML multi-line indentation foot-guns. Works cleanly with
#      `--set agePublicKeys[0]=age1qx...` from the CLI.
#
#   2) String (single key, or newline-separated for rotation):
#        agePublicKeys: "age1qx..."
#        agePublicKeys: |-
#          age1qx...
#          age1yz...
#      Backwards-compatible with installs from before the array form
#      existed.
#
# The worker always sees the same newline-separated env-var regardless
# of which form is used.
agePublicKeys: ""

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Resource limits for worker pods spawned by CronJobs. Size according to
# the largest expected dump. A MySQL/Postgres dump of ~5 GB typically needs
# ~1 GiB RAM peak. Empty values mean no limit.
workerResources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 256Mi

# K8s-native retry on Job failure. Each retry spawns a fresh worker pod
# with exponential backoff (10s, 20s, 40s, ..., capped at 6m). Catches
# transient failures (DB blips, brief network partitions) so a 30-second
# outage during the cron tick doesn't cost a full cron interval of
# missing backups. Bounded so permanent failures (wrong password, missing
# bucket) cost at most (1 + workerBackoffLimit) attempts. Set to 0 to
# disable retries entirely. Range: 0–10.
workerBackoffLimit: 2

# An emptyDir provides scratch space for the encrypted dump file before
# fan-out. Size it for the largest expected dump — bump if backups fail
# with "no space left on device".
tempDirSize: 10Gi

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080      # /metrics

# Storage scrubber — periodically re-streams the most recent encrypted
# dump per (target, destination) and compares its SHA256 with the value
# recorded in meta.json. Detects silent storage corruption / bit rot.
#
# Off by default because a scrub re-downloads the full encrypted dump from
# storage; at scale that is real egress (multiply dump size × number of
# (target, destination) pairs / interval). Enable once you've sized your
# bandwidth budget and verified your storage backend supports streaming
# reads at the expected throughput.
storageScrub:
  enabled: false
  intervalHours: 24

# Phase-2 restore-verification (schema-only / sample / full modes)
# requires the worker ServiceAccount to be able to create/delete Pods
# in the operator's namespace so it can spawn short-lived ephemeral
# DBs to restore against. Disabled by default — enable AND set
# `backup.mogenius.io/restore-verification-mode` on a source to a
# Phase-2 mode to actually use it. Phase-1 mode `stream-validate` does
# NOT need this RBAC expansion.
restoreVerification:
  enableEphemeralPodSpawn: false

# Read-only HTML/JSON dashboard served by the operator pod itself.
# Disabled by default — flip `enabled: true` to expose it on a second
# container port + Service port. The dashboard never writes to the
# cluster and never sees the age private key. Cluster-internal only by
# default; bring your own auth proxy (oauth2-proxy, ingress basic auth)
# if exposing externally.
ui:
  enabled: false
  port: 8081
  # Defense-in-depth gates on top of the (optional) external auth proxy.
  # readOnly=true disables every mutating endpoint (source/destination
  # CRUD, manual triggers, settings, age keys) — useful if the UI is
  # exposed to a wider audience for read-only audit.
  readOnly: false
  # Age recipient (public key) management is the most security-critical
  # mutation in the UI: adding a hostile key silently widens future
  # backup decryption to the attacker. Stays opt-in even when the rest
  # of the UI is read-write.
  allowKeyMutation: false
  # Defence-in-depth caps applied inside the UI HTTP server.
  # maxBodyBytes: cap on every request body to prevent OOM via giant POST.
  # maxSSEClients: cap on concurrent /api/events subscribers.
  # Both have sane in-code defaults; uncomment to override.
  # maxBodyBytes: 1048576
  # maxSSEClients: 256

# Read-only documentation portal served by the operator pod itself, on a
# separate port from the management UI. Renders CLAUDE.md (operator
# reference) and README.md (user guide), plus a generated Tech Stack page
# from go.mod. Disable by default — flip `enabled: true` to expose. The
# docs server reads no Kubernetes state and holds no credentials, so it's
# safe to expose to a wider audience than the management UI.
docs:
  enabled: false
  port: 8083
  # Path inside the container that holds CLAUDE.md, README.md, and go.mod.
  # The Dockerfile populates /app/docs at build time.
  dir: /app/docs

# Alerts integration. The UI's Alerts page calls Prometheus directly when
# prometheusURL is set; otherwise it falls back to a local heuristic that
# evaluates the same conditions on the operator's own metric registry —
# useful before kube-prometheus-stack is wired up, but does not honour
# the rule's `for:` duration.
#
# Defaults below assume kube-prometheus-stack installed in the `alert`
# namespace (this matches the test stack and most reference installs). If
# your stack lives elsewhere, override or set to "" to disable Prometheus
# integration and use the local heuristic only.
alerts:
  prometheusURL: "http://prometheus-operated.alert.svc.cluster.local:9090"
  # AlertmanagerURL is used for the "open in Alertmanager" UI link, the
  # /api/alerts/status connectivity check, and the /api/alerts/test
  # endpoint that sends a test alert via the Alertmanager v2 API.
  alertmanagerURL: "http://alertmanager-operated.alert.svc.cluster.local:9093"

# Convenience knob: kube-prometheus-stack's Prometheus selects ServiceMonitors
# AND PrometheusRules by `release: <name>`. Setting this here applies the
# label to BOTH so a typical install picks up our metrics and alert rules.
# Set to "" to opt out and use serviceMonitor.labels / prometheusRule.labels
# manually instead.
prometheusReleaseLabel: "kube-prometheus-stack"

# Conditional on Prometheus Operator presence — see _helpers.
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels merged into ServiceMonitor metadata. The `release` label is
  # added automatically from `.Values.prometheusReleaseLabel` (above) — this
  # field is for any additional custom labels.
  labels: {}

prometheusRule:
  enabled: true
  # Extra labels merged into PrometheusRule metadata. Same rules as
  # serviceMonitor.labels — `release` comes from prometheusReleaseLabel.
  labels: {}
  # Ship sensible defaults; override at install time to suit your environment.
  rules:
    - alert: BackupOverdue
      expr: time() - max by (target) (backup_operator_last_success_timestamp_seconds) > 86400 * 1.5
      for: 10m
      labels: { severity: warning }
      annotations:
        summary: "Backup target {{ $labels.target }} hasn't succeeded in over 36h"
    - alert: BackupDestinationFailing
      expr: max by (target, destination) (backup_operator_destination_failed) == 1
      for: 15m
      labels: { severity: warning }
      annotations:
        summary: "Backup target {{ $labels.target }} failing to {{ $labels.destination }}"
    - alert: BackupDumpSizeCollapsed
      expr: backup_operator_dump_size_change_ratio < 0.5
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "Backup {{ $labels.target }} shrunk to less than half — possible data loss"
    - alert: BackupSchemaChanged
      expr: backup_operator_schema_changed == 1
      for: 1m
      labels: { severity: info }
      annotations:
        summary: "Schema changed for backup target {{ $labels.target }}"
    - alert: BackupCharsetChanged
      expr: backup_operator_charset_changed == 1
      for: 1m
      labels: { severity: warning }
      annotations:
        summary: "Database charset/collation changed for backup target {{ $labels.target }} — restore may silently truncate multibyte characters"
    - alert: BackupStorageCorrupted
      expr: max by (target, destination) (backup_operator_storage_scrub_passed) == 0
      for: 1m
      labels: { severity: critical }
      annotations:
        summary: "Storage scrub failed for backup target {{ $labels.target }} on {{ $labels.destination }} — stored dump SHA256 does not match meta.json (corruption or unreachable)"
    # Retention failures are individually best-effort (the run still
    # succeeds), but cumulative failure means storage will eventually
    # fill and ALL backups stop. 24h ride-out keeps this from firing on
    # a single transient error while still catching real persistent
    # problems before they hurt.
    - alert: BackupRetentionFailing
      expr: max by (target, destination) (backup_operator_retention_last_status) == 0
      for: 24h
      labels: { severity: warning }
      annotations:
        summary: "Retention has been failing for backup target {{ $labels.target }} on {{ $labels.destination }} for >24h — storage will eventually fill and block new backups"
    - alert: BackupAnomaliesAppearing
      expr: backup_operator_last_run_anomalies > 0
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Analyzer reported {{ $value }} anomalies in the last run of {{ $labels.target }}"
    - alert: BackupLastRunFailed
      expr: backup_operator_last_run_status == 0
      for: 5m
      labels: { severity: warning }
      annotations:
        summary: "Most recent backup run for {{ $labels.target }} did not produce a usable artifact"
    # Notify on every successful run. The expression fires for ~2 minutes
    # after `last_success_timestamp_seconds` updates and then resolves, so
    # each completed run generates one firing + one resolved notification
    # (Alertmanager has send_resolved: true). This is intentionally noisy —
    # it is the "I'm still alive and working" heartbeat the user asked for.
    - alert: BackupSucceeded
      expr: time() - max by (target) (backup_operator_last_success_timestamp_seconds) < 120
      labels: { severity: info }
      annotations:
        summary: "Backup of {{ $labels.target }} completed successfully"
    # Restore-verification: an in-process round-trip test of the last
    # uploaded artifact (decrypt + parse). Only emitted when a source
    # has restore-verification-mode != off. Failed (=0) means the
    # ephemeral identity could not decrypt the dump, the gzip layer
    # blew up, or the parser found a content mismatch — all warrant
    # immediate human attention. Stale means the verifier hasn't run
    # within twice the configured interval (default verification
    # interval is 168h, so default stale threshold is 14 days).
    - alert: BackupRestoreVerificationFailed
      expr: max by (target, mode) (backup_operator_restore_verification_passed) == 0
      for: 5m
      labels: { severity: critical }
      annotations:
        summary: "Restore-verification failed for {{ $labels.target }} (mode={{ $labels.mode }}) — encrypted dump did not decrypt+parse cleanly"
    - alert: BackupRestoreVerificationStale
      expr: time() - max by (target, mode) (backup_operator_restore_verification_last_timestamp_seconds) > 86400 * 14
      for: 1h
      labels: { severity: warning }
      annotations:
        summary: "Restore-verification for {{ $labels.target }} (mode={{ $labels.mode }}) hasn't run in over 14 days"

# Restricts operator pod egress to DNS, K8s API, SSH (22/23), and HTTPS (443).
# Disabled by default — enable once you've verified your storage endpoints
# are reachable through the allowed ports. Use extraEgressRules for
# non-standard ports (e.g. MinIO on 9000, DB ports for MetricsRefresher).
networkPolicy:
  enabled: false
  extraEgressRules: []
  # Example: allow MinIO on a custom port
  # extraEgressRules:
  #   - ports:
  #       - protocol: TCP
  #         port: 9000
